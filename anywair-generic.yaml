# ESPHome replacement for a Sensibo anywAiR (Fujitsu myanywAiR) controller.
#
# This config is for building your own ESP32 wired direct to the indoor unit's
# data lines. See docs/PROTOCOL.md and README.md for wiring details.
#
# If you replicate the stock board's transistor level-shifter stage, use the
# plain (non-inverted) pins; if you connect directly with a 5V->3.3V divider
# on the ESP RX pin, use the inverted pins as shown below.

substitutions:
  name: anywair-fujitsu

esphome:
  name: ${name}
  friendly_name: anywAiR Fujitsu

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: custom_components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

logger:
  # UART0 log console is separate from the AC UART, so it can stay enabled.
  baud_rate: 115200
  level: DEBUG

ota:
  - platform: esphome

uart:
  id: ac_uart
  baud_rate: 9600
  # --- Option 1: stock-style transistor (inverting) level shifter ---
  # tx_pin: GPIO16
  # rx_pin: GPIO17
  # --- Option 2: direct connection + software inversion ---
  # The AC data lines idle LOW (inverted UART); protect ESP RX with a
  # 5V->3.3V divider (e.g. 10k series / 20k to GND).
  tx_pin:
    number: GPIO16
    inverted: true
  rx_pin:
    number: GPIO17
    inverted: true

fujitsu_ac:
  id: ac_hub
  update_interval: 5s

climate:
  - platform: fujitsu_ac
    id: ac_climate
    name: "Air Conditioner"

select:
  - platform: fujitsu_ac
    id: ac_vswing
    name: "Vertical Swing"
    swing: vertical
  - platform: fujitsu_ac
    id: ac_hswing
    name: "Horizontal Swing"
    swing: horizontal

switch:
  - platform: fujitsu_ac
    id: ac_light
    name: "AC Panel Light"

sensor:
  - platform: fujitsu_ac
    id: ac_room_temp
    name: "AC Room Temperature"
    unit_of_measurement: "°F"    # firmware divides 10:33 by 100; unit unconfirmed
    accuracy_decimals: 1
