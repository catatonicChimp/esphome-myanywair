# ESPHome for the actual Sensibo anywAiR board (ESP32-C3-MINI-1).
#
# Firmware-confirmed pins (Fuji_init in the stock app):
#   AC UART TX = GPIO5, RX = GPIO4 (already routed through Q1/Q2, so the
#   UART itself is standard polarity - no inverted: true needed here).
#   Boot/download: GPIO9 low at reset, GPIO8 pulled high, EN = reset.
#
# Power the board from 12V on J1 (pin 1 = +12V, pin 4 = GND) as before.
# Flash over UART: pull IO9 to GND, pulse EN, then `esphome run`.
#
# NOTE: the HDC1080 temperature/humidity sensor is on I2C; the stock pins
# were not identified yet. Probe with your multimeter/analyzer before
# enabling the commented block below.

substitutions:
  name: anywair-stock

esphome:
  name: ${name}
  friendly_name: anywAiR (stock board)

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: custom_components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot so a bad password doesn't leave the board unreachable.
  ap:
    ssid: "anywair-fallback"
    password: "anywair123"

captive_portal:

api:

# Keep the USB/UART0 log console (GPIO21) - this is a different peripheral
# from the AC's UART1 on GPIO5/GPIO4, so it does not conflict.
logger:
  baud_rate: 115200
  level: DEBUG

ota:
  - platform: esphome

uart:
  id: ac_uart
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 9600

fujitsu_ac:
  id: ac_hub
  update_interval: 5s
  # The indoor unit reports its room temperature in its own display unit.
  temperature_unit: fahrenheit

climate:
  - platform: fujitsu_ac
    id: ac_climate
    name: "Air Conditioner"

# This indoor unit returns 0xffff for the swing and panel-light registers, so
# those entities would only ever read "unknown". Un-comment them for units that
# do support louvre positions / a light.
#
# select:
#   - platform: fujitsu_ac
#     id: ac_vswing
#     name: "Vertical Swing"
#     swing: vertical
#   - platform: fujitsu_ac
#     id: ac_hswing
#     name: "Horizontal Swing"
#     swing: horizontal
#
# switch:
#   - platform: fujitsu_ac
#     id: ac_light
#     name: "AC Panel Light"

sensor:
  # Reported by the AC itself (10:33), always published here in °C.
  - platform: fujitsu_ac
    id: ac_room_temp
    name: "AC Room Temperature"
  # Raw diagnostic registers.
  - platform: fujitsu_ac
    type: status
    name: "AC Status (10:31)"
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: fujitsu_ac
    type: supported_modes
    name: "AC Supported Modes (11:01)"
    entity_category: diagnostic
    accuracy_decimals: 0

# --- Un-comment once you find the I2C pins ---
# i2c:
#   sda: GPIOx
#   scl: GPIOy
#   scan: true
